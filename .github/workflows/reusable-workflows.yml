name: Lint Reusable Workflows
on:
  workflow_call:
    outputs:
      yamllint-configuration-sha256:
        value: ${{ jobs.lint.outputs.yamllint-configuration-sha256 }}
        description: SHA256 of the configuration file to passing yamllint.

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      yamllint-configuration-sha256: ${{ steps.yamllint.outputs.configuration-sha256 }}
    steps:
      - name: Checkout
        uses: tmknom/secure-checkout-action@v1

      - name: Cross Yamllint
        id: yamllint
        uses: tmknom/cross-yamllint-action@0b5aaf54ed9d35655bc993f596759f997eace4d9 # v0.3.1
        with:
          configuration-url: https://raw.githubusercontent.com/tmknom/configurations/128cc66301fe96e449a1e284bb78d5e2ecfb96f2/yamllint/reusable-workflows.yml # v0.6.0

      - name: Secure actionlint
        uses: tmknom/secure-actionlint-action@1845111bba094a78635844f2c91047e1f64218b6 # v0.4.0
